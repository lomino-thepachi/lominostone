name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # 1. Enable Remote Desktop securely
      - name: 1. Enable Remote Desktop
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Enable NLA
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # Disable default broad RDP firewall rules.
          # A restricted Tailscale-only rule will be created later.
          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue


      # 2. Create RDP Account
      - name: 2. Create RDP Account
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "RDP_PASSWORD secret is missing."
              exit 1
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          # Remove old account if it exists
          if (Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "NvDAdmin"
          }

          New-LocalUser `
            -Name "NvDAdmin" `
            -Password $SecurePassword `
            -PasswordNeverExpires:$false `
            -AccountNeverExpires:$false `
            -ErrorAction Stop

          # RDP access without Administrator privileges
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "NvDAdmin" `
            -ErrorAction Stop

          Write-Host "RDP account created successfully."


      # 3. Install & Connect Tailscale
      - name: 3. Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              Write-Error "TAILSCALE_AUTHKEY secret is missing."
              exit 1
          }

          # Download installer
          $Installer = "C:\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          # Install silently
          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$Installer`" /quiet /norestart" `
            -Wait `
            -NoNewWindow

          Remove-Item $Installer -Force -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          # Connect to Tailnet
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Start-Sleep -Seconds 8

          # Get Tailscale IPv4
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          if ([string]::IsNullOrWhiteSpace($ts_ip)) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          Write-Host "Tailscale IP: $ts_ip"


      # 4. Restrict RDP to Tailscale network
      - name: 4. Configure Tailscale-only RDP Firewall
        run: |

          # Make sure broad RDP rules remain disabled
          Disable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Allow RDP only from Tailscale address space
          New-NetFirewallRule `
            -DisplayName "RDP over Tailscale Only" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any `
            -ErrorAction Stop

          Write-Host "RDP firewall restricted to Tailscale."


      # 5. Verify connectivity
      - name: 5. Verify RDP
        run: |

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host "Testing RDP on Tailscale IP: $ts_ip"

          $result = Test-NetConnection `
            -ComputerName $ts_ip `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP connectivity test failed."
              exit 1
          }

          Write-Host "RDP connectivity successful."


      # 6. Keep Server Alive
      - name: 6. Keep Server Alive (48 Hours)
        run: |

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        RDP SERVER IS READY"
          Write-Host "=============================================="
          Write-Host "Tailscale IP : $ts_ip"
          Write-Host "Username     : NvDAdmin"
          Write-Host "Password     : Stored in GitHub Secret"
          Write-Host "=============================================="

          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
