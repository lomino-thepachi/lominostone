name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "WinGet App IDs separated by commas"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USER: Arash110
      RDP_PORT: "3389"
      TAILSCALE_HOSTNAME: github-rdp-${{ github.run_id }}

    steps:

      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Ensure the Remote Desktop service is running
          Set-Service -Name TermService -StartupType Automatic -ErrorAction Stop
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue

          Disable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          Write-Host 'Remote Desktop enabled with NLA.'


      - name: 2. Create RDP Administrator Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw 'RDP_PASSWORD GitHub Secret is missing.'
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if ($ExistingUser) {
              Remove-LocalUser `
                -Name $env:RDP_USER `
                -ErrorAction Stop
          }

          New-LocalUser `
            -Name $env:RDP_USER `
            -Password $SecurePassword `
            -PasswordNeverExpires:$false `
            -UserMayNotChangePassword $true `
            -AccountNeverExpires:$false `
            -Description 'Temporary GitHub Actions RDP administrator' `
            -ErrorAction Stop

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $env:RDP_USER `
            -ErrorAction Stop

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $env:RDP_USER `
            -ErrorAction Stop

          Write-Host 'RDP Administrator account created.'


      - name: 3. Install Applications with WinGet
        shell: powershell
        env:
          APPS_INPUT: ${{ inputs.apps }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:APPS_INPUT)) {
              Write-Host 'No applications requested.'
              exit 0
          }

          $Packages = @(
              $env:APPS_INPUT -split ','
          ) | ForEach-Object {
              $_.Trim()
          } | Where-Object {
              $_ -ne ''
          } | Select-Object -Unique

          $Winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if (-not $Winget) {
              throw 'WinGet is not available on this runner.'
          }

          foreach ($PackageId in $Packages) {

              Write-Host "Installing $PackageId"

              & winget.exe install `
                --id $PackageId `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity `
                --scope machine `
                --no-upgrade

              if ($LASTEXITCODE -ne 0) {
                  throw "WinGet failed for $PackageId. Exit code: $LASTEXITCODE"
              }

              Write-Host "Installed $PackageId"
          }


      - name: 4. Install and Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw 'TAILSCALE_AUTHKEY GitHub Secret is missing.'
          }

          $Installer = 'C:\tailscale.msi'
          $TailscaleExe = 'C:\Program Files\Tailscale\tailscale.exe'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $Installer

          Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList "/i `"$Installer`" /quiet /norestart" `
            -Wait `
            -NoNewWindow

          Remove-Item `
            -Path $Installer `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 8

          if (-not (Test-Path $TailscaleExe)) {
              throw 'Tailscale executable was not found.'
          }

          & $TailscaleExe up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="$env:TAILSCALE_HOSTNAME" `
            --accept-routes=false `
            --accept-dns=false `
            --unattended

          if ($LASTEXITCODE -ne 0) {
              throw 'Tailscale connection failed.'
          }

          & $TailscaleExe set `
            --accept-routes=false

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to disable Tailscale subnet routes.'
          }

          # Retry to get the Tailscale IPv4 address
          $ts_ip = $null
          for ($j = 1; $j -le 12; $j++) {
              $ts_ip = (& $TailscaleExe ip -4).Trim()
              if (-not [string]::IsNullOrWhiteSpace($ts_ip)) { break }
              Start-Sleep -Seconds 3
          }

          if ([string]::IsNullOrWhiteSpace($ts_ip)) {
              throw 'Tailscale IPv4 address was not assigned.'
          }

          Write-Host "Tailscale IPv4: $ts_ip"


      - name: 5. Configure Tailscale-only RDP Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $RuleName = 'RDP over Tailscale Only'

          Disable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          $OldRules = Get-NetFirewallRule `
            -DisplayName $RuleName `
            -ErrorAction SilentlyContinue

          if ($OldRules) {
              $OldRules | Remove-NetFirewallRule
          }

          New-NetFirewallRule `
            -DisplayName $RuleName `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort $env:RDP_PORT `
            -RemoteAddress '100.64.0.0/10' `
            -Action Allow `
            -Profile Any `
            -Enabled True `
            -ErrorAction Stop

          Write-Host 'RDP is restricted to Tailscale.'


      - name: 6. Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $TailscaleExe = 'C:\Program Files\Tailscale\tailscale.exe'
          $ts_ip = (& $TailscaleExe ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ts_ip)) {
              throw 'Could not retrieve Tailscale IPv4.'
          }

          $result = Test-NetConnection `
            -ComputerName $ts_ip `
            -Port $env:RDP_PORT `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              throw 'RDP connectivity test failed.'
          }

          Write-Host 'RDP connectivity successful.'


      - name: 7. Server Information
        shell: powershell
        run: |
          $TailscaleExe = 'C:\Program Files\Tailscale\tailscale.exe'
          $ts_ip = (& $TailscaleExe ip -4).Trim()

          Write-Host ''
          Write-Host '=============================================='
          Write-Host '            RDP SERVER IS READY'
          Write-Host '=============================================='
          Write-Host "Tailscale IP : $ts_ip"
          Write-Host "Hostname     : $env:TAILSCALE_HOSTNAME"
          Write-Host "Username     : $env:RDP_USER"
          Write-Host 'Password     : Stored in GitHub Secret'
          Write-Host 'Administrator: YES'
          Write-Host "RDP Port     : $env:RDP_PORT"
          Write-Host 'Lifetime     : 6 Hours'
          Write-Host '=============================================='


      - name: 8. Keep Server Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $TailscaleExe = 'C:\Program Files\Tailscale\tailscale.exe'

          for ($i = 1; $i -le 360; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/360] Server running..."

              # Check Tailscale status every 10 minutes
              if ($i % 10 -eq 0) {
                  $status = & $TailscaleExe status --json 2>$null
                  if (-not $?) {
                      Write-Host "Warning: Tailscale status check failed at minute $i"
                  }
              }
          }
          
