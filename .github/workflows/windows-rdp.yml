name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated winget IDs to pre-install (e.g. "Git.Git,Microsoft.VisualStudioCode")'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USER: NvDAdmin
      RDP_PORT: 3389
      TAILSCALE_HOSTNAME: github-rdp-server

    steps:
      # ============================================================
      # 1. Enable Remote Desktop
      # ============================================================
      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Enabling Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Write-Host "Remote Desktop enabled."

      # ============================================================
      # 2. Pre-install apps via winget (native, no admin RDP needed)
      # ============================================================
      - name: 2. Pre-install Apps (winget)
        if: ${{ inputs.apps != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $apps = "${{ inputs.apps }}".Split(',', [StringSplitOptions]::RemoveEmptyEntries).Trim()
          if ($apps.Count -gt 0) {
              Write-Host "Installing: $($apps -join ', ')"
              foreach ($app in $apps) {
                  winget install --id $app --silent --accept-source-agreements --accept-package-agreements
              }
          }

      # ============================================================
      # 3. Create RDP Account (NON-ADMIN, expiring)
      # ============================================================
      - name: 3. Create RDP Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw "RDP_PASSWORD secret missing." }
          Write-Host "Creating RDP account: $env:RDP_USER"
          $SecurePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $ExistingUser = Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue
          if ($ExistingUser) { Remove-LocalUser -Name $env:RDP_USER -ErrorAction Stop }
          New-LocalUser -Name $env:RDP_USER -Password $SecurePassword -PasswordNeverExpires:$false -AccountNeverExpires:$false -Description "Temporary GitHub Actions RDP user (non-admin)" -ErrorAction Stop
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER -ErrorAction Stop
          Write-Host "RDP account created (non-admin)."

      # ============================================================
      # 4. Install & Connect Tailscale
      # ============================================================
      - name: 4. Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) { throw "TAILSCALE_AUTHKEY secret missing." }
          $Installer = "C:\tailscale.msi"
          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $Installer
          Write-Host "Installing Tailscale..."
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$Installer`" /quiet /norestart" -Wait -NoNewWindow
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          if (-not (Test-Path $TailscaleExe)) { throw "Tailscale not found after install." }
          Write-Host "Connecting Tailscale..."
          & $TailscaleExe up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="$env:TAILSCALE_HOSTNAME"
          if ($LASTEXITCODE -ne 0) { throw "Tailscale connection failed." }
          Start-Sleep -Seconds 8
          $ts_ip = (& $TailscaleExe ip -4).Trim()
          if ([string]::IsNullOrWhiteSpace($ts_ip)) { throw "Tailscale IPv4 not assigned." }
          Write-Host "Tailscale IPv4: $ts_ip"

      # ============================================================
      # 5. Allow RDP only over Tailscale
      # ============================================================
      - name: 5. Configure Tailscale-only RDP Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $RuleName = "RDP over Tailscale Only"
          Write-Host "Configuring RDP firewall..."
          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Get-NetFirewallRule -DisplayName $RuleName -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName $RuleName -Direction Inbound -Protocol TCP -LocalPort $env:RDP_PORT -RemoteAddress "100.64.0.0/10" -Action Allow -Profile Any -ErrorAction Stop
          Write-Host "RDP restricted to Tailscale."

      # ============================================================
      # 6. Verify RDP connectivity
      # ============================================================
      - name: 6. Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
          $ts_ip = (& $TailscaleExe ip -4).Trim()
          if ([string]::IsNullOrWhiteSpace($ts_ip)) { throw "Could not retrieve Tailscale IPv4." }
          Write-Host "Testing RDP on $ts_ip:$env:RDP_PORT"
          $result = Test-NetConnection -ComputerName $ts_ip -Port $env:RDP_PORT -WarningAction SilentlyContinue
          if (-not $result.TcpTestSucceeded) { throw "RDP connectivity test failed." }
          Write-Host "RDP connectivity successful."

      # ============================================================
      # 7. Keep alive (6 hours)
      # ============================================================
      - name: 7. Keep Server Alive (6 Hours)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
          $ts_ip = (& $TailscaleExe ip -4).Trim()
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "            RDP SERVER IS READY"
          Write-Host "=============================================="
          Write-Host "Tailscale IP : $ts_ip"
          Write-Host "Username     : $env:RDP_USER"
          Write-Host "Password     : Stored in GitHub Secret"
          Write-Host "Admin Access : NO (pre-install via winget instead)"
          Write-Host "RDP Port     : $env:RDP_PORT"
          Write-Host "Lifetime     : 6 Hours"
          Write-Host "=============================================="
          Write-Host ""
          for ($i = 1; $i -le 360; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/360] Server running..."
          }
